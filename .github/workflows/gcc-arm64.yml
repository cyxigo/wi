name: "GCC ARM64 (Linux)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (union=${{ matrix.union }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        union: [n, y]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build
        run: |
          xmake f --toolchain=gcc --union=${{ matrix.union }} --werror=y
          xmake

      - name: Run tests
        run: PATH="$PWD/bin/arm64:$PATH" python3 util/test.py
